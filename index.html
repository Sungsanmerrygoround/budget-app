<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>내 가계부</title>
  <link rel="apple-touch-icon" href="icon-180x180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F2FB;
      --surface: #FFFFFF;
      --surface2: #EFECF8;
      --border: rgba(79,70,229,0.08);
      --shadow-xs: 0 1px 3px rgba(79,70,229,0.06), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-sm: 0 2px 10px rgba(79,70,229,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 20px rgba(79,70,229,0.11), 0 2px 6px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 40px rgba(79,70,229,0.17), 0 3px 12px rgba(0,0,0,0.07);
      --primary: #4F46E5;
      --primary-soft: #EEF2FF;
      --primary-dim: rgba(79,70,229,0.1);
      --red: #EF4444;
      --red-soft: #FFF5F5;
      --text: #0F172A;
      --sub: #64748B;
      --sub2: #94A3B8;
      --radius: 20px;
      --radius-sm: 14px;
      --serif: 'DM Serif Display', serif;
      --sans: 'Outfit', 'Noto Sans KR', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    }

    /* ─── HEADER ─── */
    header {
      padding: calc(env(safe-area-inset-top, 44px) + 4px) 20px 0;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-title {
      font-family: var(--serif);
      font-size: 28px;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .header-title span { color: var(--primary); }

    .header-year {
      font-size: 11px;
      color: var(--sub);
      font-weight: 600;
      letter-spacing: 0.06em;
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }

    /* ─── MONTH TABS ─── */
    .month-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 16px;
      scrollbar-width: none;
    }
    .month-scroll::-webkit-scrollbar { display: none; }

    .month-tab {
      flex-shrink: 0;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--sub);
      transition: all 0.2s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-xs);
    }

    .month-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 3px 12px rgba(79,70,229,0.35);
    }

    /* ─── HERO CARD ─── */
    .hero-card {
      margin: 0 16px 16px;
      background: linear-gradient(135deg, #5B5BD6 0%, #4338CA 55%, #312E81 100%);
      border-radius: 26px;
      padding: 26px 24px 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(67,56,202,0.32), 0 2px 8px rgba(67,56,202,0.15);
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -50px; right: -40px;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -20px;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hero-amount {
      font-family: var(--serif);
      font-size: 42px;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero-budget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hero-budget-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    .hero-budget-label span { color: rgba(255,255,255,0.75); font-weight: 600; }

    .hero-budget-remain {
      font-family: var(--serif);
      font-size: 18px;
      color: rgba(255,255,255,0.9);
    }

    .hero-bar-bg {
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .hero-bar-fill {
      height: 100%;
      border-radius: 6px;
      background: rgba(255,255,255,0.85);
      transition: width 0.65s cubic-bezier(.4,0,.2,1), background 0.3s;
    }

    .hero-bar-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      margin-bottom: 18px;
    }

    .hero-budget-edit { display: flex; gap: 8px; }

    .hero-budget-input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 13px;
      font-size: 14px;
      font-family: var(--sans);
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }

    .hero-budget-input::placeholder { color: rgba(255,255,255,0.38); }
    .hero-budget-input:focus {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.4);
    }

    .hero-btn-budget {
      padding: 12px 18px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.22);
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--sans);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .hero-btn-budget:active { background: rgba(255,255,255,0.28); }

    /* ─── VIEW PANELS ─── */
    .view-panel { display: none; padding-top: 4px; }
    .view-panel.active { display: block; }

    .section { margin: 0 16px 14px; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--sub2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ─── FORM ─── */
    .form-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .form-row { display: flex; gap: 10px; margin-bottom: 12px; }

    .field-wrap { width: 100%; display: flex; flex-direction: column; gap: 6px; }

    .field-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--sub);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding-left: 2px;
    }

    select, input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      font-size: 14px;
      font-family: var(--sans);
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-dim);
      background: var(--surface);
    }

    .select-wrap { position: relative; width: 100%; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      font-size: 11px; color: var(--sub);
      pointer-events: none;
    }

    .btn-add {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-family: var(--sans);
      font-size: 15px;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-top: 8px;
      border: none;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 18px rgba(79,70,229,0.3);
      transition: all 0.15s;
    }

    .btn-add:active { opacity: 0.9; transform: scale(0.99); }

    /* ─── CHART ─── */
    .chart-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .chart-wrap { position: relative; height: 210px; margin-top: 12px; }

    /* ─── CATEGORY LIST ─── */
    .cat-list { display: flex; flex-direction: column; gap: 8px; }

    .cat-item {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.18s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-xs);
    }

    .cat-item:active { background: var(--primary-soft); transform: scale(0.99); }

    .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cat-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .cat-total { font-family: var(--serif); font-size: 16px; color: var(--red); }
    .cat-bar-bg { background: var(--surface2); border-radius: 4px; height: 4px; overflow: hidden; }
    .cat-bar { height: 100%; border-radius: 4px; transition: width 0.65s cubic-bezier(.4,0,.2,1); }

    /* ─── ENTRY LIST ─── */
    .entry-list { display: flex; flex-direction: column; gap: 8px; }

    .entry-item {
      background: var(--surface);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.18s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-xs);
    }

    .entry-item:active { background: var(--surface2); transform: scale(0.99); }

    .entry-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }

    .entry-icon {
      width: 42px; height: 42px;
      border-radius: 13px;
      background: var(--primary-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .entry-text { overflow: hidden; }
    .entry-desc { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-meta { font-size: 11px; color: var(--sub2); margin-top: 3px; }
    .entry-amt-expense { font-family: var(--serif); font-size: 16px; color: var(--red); flex-shrink: 0; margin-left: 12px; }

    .empty { text-align: center; color: var(--sub2); padding: 48px 20px; font-size: 13px; font-weight: 500; }

    /* ─── CALENDAR ─── */
    .cal-wrap {
      margin: 0 16px 14px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .cal-dow {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .cal-dow span {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      padding: 11px 0;
      color: var(--sub);
      letter-spacing: 0.06em;
    }

    .cal-dow span:first-child { color: var(--red); }
    .cal-dow span:last-child { color: #3B7DD8; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

    .cal-cell {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      min-height: 58px;
      padding: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:not(.empty):active { background: var(--primary-soft); }
    .cal-cell.today { background: var(--primary-soft); }
    .cal-cell.empty { background: rgba(0,0,0,0.015); cursor: default; }

    .cal-day { font-size: 12px; font-weight: 500; margin-bottom: 3px; color: var(--sub); }

    .cal-cell.today .cal-day {
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }

    .cal-cell:nth-child(7n+1) .cal-day { color: var(--red); }
    .cal-cell:nth-child(7n) .cal-day { color: #3B7DD8; }

    .cal-amt {
      font-size: 9px; font-weight: 700;
      color: var(--primary); background: var(--primary-soft);
      border-radius: 4px; padding: 1px 4px; display: inline-block;
    }

    /* ─── BOTTOM NAV ─── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      z-index: 100;
      box-shadow: 0 -2px 20px rgba(79,70,229,0.07);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s cubic-bezier(.4,0,.2,1);
    }

    .nav-btn:active { transform: scale(0.92); }
    .nav-btn.active { background: var(--primary-soft); }

    .nav-icon { font-size: 22px; line-height: 1; }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--sub2);
      font-family: var(--sans);
      transition: color 0.2s;
    }

    .nav-btn.active .nav-label { color: var(--primary); }

    /* ─── MODAL ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      border-top: 1px solid var(--border);
      padding: 22px 20px calc(48px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      animation: slideUp 0.28s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -6px 40px rgba(15,23,42,0.12);
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-handle {
      width: 36px; height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .modal-title {
      font-family: var(--serif);
      font-size: 18px;
      margin-bottom: 18px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .modal-close {
      background: var(--surface2);
      border: 1px solid var(--border);
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      color: var(--sub);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .detail-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-item:last-child { border-bottom: none; }
    .detail-desc { font-size: 14px; font-weight: 600; }
    .detail-meta { font-size: 11px; color: var(--sub2); margin-top: 3px; }
    .detail-amt { font-family: var(--serif); font-size: 16px; color: var(--red); flex-shrink: 0; margin-left: 12px; }

    /* ─── EDIT MODAL ─── */
    .edit-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .edit-modal-overlay.open { display: flex; }

    .edit-modal {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 28px 22px;
      width: 100%;
      max-width: 400px;
      animation: popIn 0.22s cubic-bezier(.34,1.4,.64,1);
      box-shadow: var(--shadow-lg);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .edit-modal-title {
      font-family: var(--serif);
      font-size: 18px;
      margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .edit-field { margin-bottom: 14px; }

    .edit-field label {
      font-size: 10px;
      font-weight: 700;
      color: var(--sub);
      display: block;
      margin-bottom: 6px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .edit-btn-row { display: flex; gap: 10px; margin-top: 22px; }

    .btn-delete {
      flex: 1; padding: 14px;
      background: var(--red-soft);
      color: var(--red);
      border: 1.5px solid rgba(239,68,68,0.12);
      border-radius: 13px;
      font-size: 13px; font-weight: 700; font-family: var(--sans); cursor: pointer;
      transition: all 0.15s;
    }

    .btn-delete:active { opacity: 0.8; transform: scale(0.98); }

    .btn-save {
      flex: 2; padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none; border-radius: 13px;
      font-size: 14px; font-weight: 700; font-family: var(--sans); cursor: pointer;
      box-shadow: 0 3px 12px rgba(79,70,229,0.28);
      transition: all 0.15s;
    }

    .btn-save:active { opacity: 0.9; transform: scale(0.99); }

    /* ─── LOADING BAR ─── */
    #loadingBar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), #818CF8);
      z-index: 999;
      animation: loadpulse 1s infinite alternate;
    }

    @keyframes loadpulse { from { opacity: 0.5 } to { opacity: 1 } }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-title">내 <span>가계부</span></div>
    <div class="header-year" id="yearLabel"></div>
  </div>
  <div class="month-scroll" id="monthTabs"></div>
</header>

<div class="hero-card">
  <div class="hero-label">이번 달 지출</div>
  <div class="hero-amount" id="totalExpense">0원</div>
  <div class="hero-budget-row">
    <div class="hero-budget-label">월 예산 &nbsp;<span id="totalBudget">미설정</span></div>
    <div class="hero-budget-remain" id="remainBudget">—</div>
  </div>
  <div class="hero-bar-bg">
    <div class="hero-bar-fill" id="budgetFill" style="width:0%"></div>
  </div>
  <div class="hero-bar-info">
    <span id="budgetUsedPct">예산을 설정해주세요</span>
    <span id="budgetUsedAmt"></span>
  </div>
  <div class="hero-budget-edit">
    <input class="hero-budget-input" type="number" id="budgetInput" placeholder="이번 달 예산 (원)" inputmode="numeric">
    <button class="hero-btn-budget" onclick="saveBudget()">설정</button>
  </div>
</div>

<div class="view-panel active" id="panel-add">
  <div class="section">
    <div class="form-card">
      <div class="form-row">
        <div class="field-wrap">
          <div class="field-label">카테고리</div>
          <div class="select-wrap">
            <select id="category">
              <option>외식비</option><option>자기계발비</option><option>취미</option>
              <option>생필품</option><option>교통비</option><option>식비</option>
              <option>고정비</option><option>데이트</option><option>기타</option>
            </select>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="field-wrap">
          <div class="field-label">내용</div>

          <input type="text" id="desc" placeholder="예: 스타벅스 아이스 라떼">
        </div>
      </div>
      <div class="form-row">
        <div class="field-wrap">
          <div class="field-label">금액</div>
          <input type="number" id="amount" placeholder="금액 (원)" inputmode="numeric">
        </div>
        <div class="field-wrap">
          <div class="field-label">날짜</div>
          <input type="date" id="entryDate">
        </div>
      </div>
      <button class="btn-add" onclick="addEntry()">추가하기</button>
    </div>
  </div>
</div>

<div class="view-panel" id="panel-chart">
  <div class="section">
    <div class="chart-card">
      <div class="section-title">카테고리별 지출</div>
      <div class="chart-wrap"><canvas id="myChart"></canvas></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">상세 내역</div>
    <div class="cat-list" id="catList"></div>
  </div>
</div>

<div class="view-panel" id="panel-cal">
  <div class="cal-wrap">
    <div class="cal-dow">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<div class="view-panel" id="panel-list">
  <div class="section">
    <div class="section-title">전체 내역</div>
    <div class="entry-list" id="entryList"></div>
  </div>
</div>

<div class="edit-modal-overlay" id="editModalOverlay" onclick="closeEditModal(event)">
  <div class="edit-modal">
    <div class="edit-modal-title">
      <span>내역 수정</span>
      <button class="modal-close" onclick="closeEditModalDirect()">✕</button>
    </div>
    <div class="edit-field">
      <label>카테고리</label>
      <div class="select-wrap">
        <select id="editCategory">
          <option>외식비</option><option>자기계발비</option><option>취미</option>
          <option>생필품</option><option>교통비</option><option>식비</option>
          <option>고정비</option><option>데이트</option><option>기타</option>
        </select>
      </div>
    </div>
    <div class="edit-field">
      <label>내용</label>
      <input type="text" id="editDesc" placeholder="내용">
    </div>
    <div class="edit-field">
      <label>금액</label>
      <input type="number" id="editAmount" placeholder="금액 (원)" inputmode="numeric">
    </div>
    <div class="edit-field">
      <label>날짜</label>
      <input type="date" id="editDate">
    </div>
    <div class="edit-btn-row">
      <button class="btn-delete" onclick="deleteEntry()">🗑 삭제</button>
      <button class="btn-save" onclick="saveEdit()">저장하기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <span id="modalTitle"></span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchView('add')">
    <span class="nav-icon">➕</span>
    <span class="nav-label">추가</span>
  </button>
  <button class="nav-btn" onclick="switchView('chart')">
    <span class="nav-icon">📊</span>
    <span class="nav-label">차트</span>
  </button>
  <button class="nav-btn" onclick="switchView('cal')">
    <span class="nav-icon">📅</span>
    <span class="nav-label">달력</span>
  </button>
  <button class="nav-btn" onclick="switchView('list')">
    <span class="nav-icon">📋</span>
    <span class="nav-label">내역</span>
  </button>
</nav>

<div id="loadingBar"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzbqz6rFZyBcLlRtdtAZDTKaB6skCbLT8",
    authDomain: "hj-budget-app.firebaseapp.com",
    projectId: "hj-budget-app",
    storageBucket: "hj-budget-app.firebasestorage.app",
    messagingSenderId: "473210016002",
    appId: "1:473210016002:web:59221e2e9a821a911ab21b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const CATS = ['외식비','자기계발비','취미','생필품','교통비','식비','고정비','데이트','기타'];
  const CAT_ICONS = {'외식비':'🍽️','자기계발비':'📚','취미':'🎮','생필품':'🛒','교통비':'🚇','식비':'🥗','고정비':'🏠','데이트':'💑','기타':'📦'};
  const CAT_COLORS = ['#4F46E5','#7C3AED','#DB2777','#EA580C','#059669','#65A30D','#DC2626','#D97706','#64748B'];

  let now = new Date();
  let currentMonth = now.getMonth();
  let currentYear = now.getFullYear();
  let chartInstance = null;
  let activeView = 'add';
  let cachedEntries = [];
  let cachedBudget = 0;

  function docId() { return `${currentYear}_${currentMonth}`; }
  function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }
  function showLoading(on) { document.getElementById('loadingBar').style.display = on ? 'block' : 'none'; }

  async function loadData() {
    showLoading(true);
    try {
      const snap = await getDoc(doc(db, 'budgets', docId()));
      if (snap.exists()) {
        const data = snap.data();
        cachedEntries = data.entries || [];
        cachedBudget = data.budget || 0;
      } else {
        cachedEntries = [];
        cachedBudget = 0;
      }
    } catch(e) { console.error(e); }
    showLoading(false);
    render();
  }

  async function saveData() {
    try {
      await setDoc(doc(db, 'budgets', docId()), { entries: cachedEntries, budget: cachedBudget });
    } catch(e) { alert('저장 오류. 인터넷 연결을 확인해주세요.'); }
  }

  async function saveBudget() {
    const val = parseInt(document.getElementById('budgetInput').value);
    if (!val || val <= 0) { alert('예산을 올바르게 입력해주세요!'); return; }
    cachedBudget = val;
    document.getElementById('budgetInput').value = '';
    await saveData();
    render();
  }
  window.saveBudget = saveBudget;

  function buildMonthTabs() {
    const container = document.getElementById('monthTabs');
    document.getElementById('yearLabel').textContent = currentYear + '년';
    container.innerHTML = '';
    MONTHS.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'month-tab' + (i === currentMonth ? ' active' : '');
      btn.textContent = m;
      btn.onclick = () => { currentMonth = i; buildMonthTabs(); loadData(); };
      container.appendChild(btn);
    });
    setTimeout(() => {
      const active = container.querySelector('.active');
      if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
    }, 50);
  }

  function render() {
    const entries = cachedEntries;
    const budget = cachedBudget;
    const expense = entries.reduce((s,e) => s+e.amount, 0);
    const remain = budget - expense;
    const pct = budget > 0 ? Math.min(Math.round(expense / budget * 100), 100) : 0;

    document.getElementById('totalExpense').textContent = fmt(expense);
    document.getElementById('totalBudget').textContent = budget > 0 ? fmt(budget) : '미설정';

    const fill = document.getElementById('budgetFill');
    const remainEl = document.getElementById('remainBudget');
    if (budget > 0) {
      remainEl.textContent = remain < 0 ? `${fmt(-remain)} 초과` : fmt(remain);
      remainEl.style.color = remain < 0 ? '#FCA5A5' : 'rgba(255,255,255,0.95)';
      fill.style.width = pct + '%';
      fill.style.background = pct >= 90 ? '#FCA5A5' : pct >= 70 ? '#FCD34D' : 'rgba(255,255,255,0.85)';
      document.getElementById('budgetUsedPct').textContent = `${pct}% 사용`;
      document.getElementById('budgetUsedAmt').textContent = remain < 0 ? `${fmt(-remain)} 초과` : `${fmt(remain)} 남음`;
    } else {
      remainEl.textContent = '—';
      remainEl.style.color = 'rgba(255,255,255,0.4)';
      fill.style.width = '0%';
      document.getElementById('budgetUsedPct').textContent = '예산을 설정해주세요';
      document.getElementById('budgetUsedAmt').textContent = '';
    }
    renderChart(entries);
    renderCatList(entries);
    renderEntryList(entries);
    if (activeView === 'cal') renderCalendar();
  }

  function renderChart(entries) {
    const totals = CATS.map(c => entries.filter(e => e.category === c).reduce((s,e) => s+e.amount, 0));
    const hasData = totals.some(t => t > 0);
    const ctx = document.getElementById('myChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    if (!hasData) {
      chartInstance = null;
      ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
      ctx.font = '500 13px Outfit, Noto Sans KR, sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.textAlign = 'center';
      ctx.fillText('지출 내역이 없어요', ctx.canvas.width/2, 100);
      return;
    }
    const filtered = CATS.map((c,i) => ({ label: c, value: totals[i], color: CAT_COLORS[i] })).filter(d => d.value > 0);
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: filtered.map(d => d.label),
        datasets: [{
          data: filtered.map(d => d.value),
          backgroundColor: filtered.map(d => d.color + '1A'),
          borderColor: filtered.map(d => d.color),
          borderWidth: 2.5,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'right',
            labels: {
              font: { size: 11, family: 'Outfit, Noto Sans KR, sans-serif', weight: '500' },
              color: '#64748B',
              padding: 10,
              boxWidth: 10, boxHeight: 10,
              usePointStyle: true, pointStyle: 'circle'
            }
          },
          tooltip: {
            callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toLocaleString('ko-KR')}원` }
          }
        }
      }
    });
  }

  function renderCatList(entries) {
    const maxTotal = Math.max(...CATS.map(c => entries.filter(e => e.category === c).reduce((s,e) => s+e.amount, 0)), 1);
    const container = document.getElementById('catList');
    const rows = CATS.map((cat, i) => ({ cat, total: entries.filter(e => e.category === cat).reduce((s,e) => s+e.amount, 0), i })).filter(r => r.total > 0).sort((a,b) => b.total - a.total);
    if (rows.length === 0) { container.innerHTML = '<div class="empty">지출 내역이 없어요</div>'; return; }
    container.innerHTML = rows.map(({cat, total, i}) => `
      <div class="cat-item" onclick="openModal('${cat}')">
        <div class="cat-header"><div class="cat-name">${CAT_ICONS[cat]||'📦'} ${cat}</div><div class="cat-total">${fmt(total)}</div></div>
        <div class="cat-bar-bg"><div class="cat-bar" style="width:${Math.round(total/maxTotal*100)}%;background:${CAT_COLORS[i]}"></div></div>
      </div>`).join('');
  }

  function renderEntryList(entries) {
    const container = document.getElementById('entryList');
    if (entries.length === 0) { container.innerHTML = '<div class="empty">아직 내역이 없어요</div>'; return; }
    container.innerHTML = entries.map((e,i) => ({...e, realIndex: i})).reverse().map(e => `
      <div class="entry-item" onclick="openEditModal(${e.realIndex})">
        <div class="entry-left">
          <div class="entry-icon">${CAT_ICONS[e.category]||'📦'}</div>
          <div class="entry-text">
            <div class="entry-desc">${e.desc}</div>
            <div class="entry-meta">${e.date} · ${e.category}</div>
          </div>
        </div>
        <div class="entry-amt-expense">-${fmt(e.amount)}</div>
      </div>`).join('');
  }

  async function addEntry() {
    const category = document.getElementById('category').value;
    const desc = document.getElementById('desc').value.trim();
    const amount = parseInt(document.getElementById('amount').value);
    if (!desc || !amount || amount <= 0) { alert('내용과 금액을 입력해주세요!'); return; }

    const dateVal = document.getElementById('entryDate').value;
    let date;
    if (dateVal) {
      const [, mm, dd] = dateVal.split('-');
      const now = new Date();
      date = `${parseInt(mm)}/${parseInt(dd)} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    } else {
      const d = new Date();
      date = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    cachedEntries.push({ category, desc, amount, date });
    await saveData();
    render();
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
    setTodayDate();
  }
  window.addEntry = addEntry;

  function setTodayDate() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    document.getElementById('entryDate').value = `${yyyy}-${mm}-${dd}`;
  }

  function switchView(view) {
    activeView = view;
    const views = ['add','chart','cal','list'];
    document.querySelectorAll('.nav-btn').forEach((t,i) => t.classList.toggle('active', views[i] === view));
    document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + view).classList.add('active');
    if (view === 'chart') render();
    if (view === 'cal') renderCalendar();
  }
  window.switchView = switchView;

  function renderCalendar() {
    const entries = cachedEntries;
    const year = currentYear, month = currentMonth;
    const today = new Date();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dayMap = {};
    entries.forEach(e => { const dayStr = e.date.split(' ')[0]; if (!dayMap[dayStr]) dayMap[dayStr] = []; dayMap[dayStr].push(e); });
    const grid = document.getElementById('calGrid');
    let html = '';
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dayStr = `${month+1}/${d}`;
      const dayEntries = dayMap[dayStr] || [];
      const total = dayEntries.reduce((s,e) => s+e.amount, 0);
      const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
      html += `<div class="cal-cell ${isToday?'today':''}" onclick="showDayDetail(${d})">
        <div class="cal-day">${d}</div>${total > 0 ? `<div class="cal-amt">${(total/10000).toFixed(1)}만</div>` : ''}</div>`;
    }
    grid.innerHTML = html;
  }

  window.showDayDetail = function(d) {
    const month = currentMonth, year = currentYear;
    const dayStr = `${month+1}/${d}`;
    const dayEntries = cachedEntries.filter(e => e.date.split(' ')[0] === dayStr);
    const total = dayEntries.reduce((s,e) => s+e.amount, 0);
    const dow = ['일','월','화','수','목','금','토'][new Date(year, month, d).getDay()];

    document.getElementById('modalTitle').innerHTML =
      `<span style="font-size:15px;font-family:var(--sans);font-weight:700">${month+1}월 ${d}일 (${dow})</span>&nbsp;<span style="font-family:var(--serif);font-size:17px;color:var(--red)">${total > 0 ? fmt(total) : ''}</span>`;

    if (dayEntries.length === 0) {
      document.getElementById('modalBody').innerHTML =
        `<div class="empty" style="padding:36px 0 20px">이 날은 지출 내역이 없어요 😊</div>`;
    } else {
      document.getElementById('modalBody').innerHTML = dayEntries.map(e => {
        const realIndex = cachedEntries.indexOf(e);
        return `<div class="detail-item" onclick="openEditFromDay(${realIndex})" style="cursor:pointer">
          <div>
            <div class="detail-desc">${e.desc} <span style="font-size:11px;color:var(--sub2)">[${e.category}]</span></div>
            <div class="detail-meta">${e.date} · 탭해서 수정</div>
          </div>
          <div class="detail-amt">-${fmt(e.amount)}</div>
        </div>`;
      }).join('');
    }
    document.getElementById('modalOverlay').classList.add('open');
  };

  window.openEditFromDay = function(index) {
    closeModalDirect();
    setTimeout(() => openEditModal(index), 180);
  };

  function openModal(cat) {
    const entries = cachedEntries.filter(e => e.category === cat);
    const total = entries.reduce((s,e) => s+e.amount, 0);
    document.getElementById('modalTitle').textContent = `${CAT_ICONS[cat]} ${cat} · ${fmt(total)}`;
    document.getElementById('modalBody').innerHTML = entries.length === 0 ? '<div class="empty">내역이 없어요</div>' :
      [...entries].reverse().map(e => `<div class="detail-item"><div><div class="detail-desc">${e.desc}</div><div class="detail-meta">${e.date}</div></div><div class="detail-amt">-${fmt(e.amount)}</div></div>`).join('');
    document.getElementById('modalOverlay').classList.add('open');
  }
  window.openModal = openModal;

  let editingIndex = -1;

  function openEditModal(index) {
    const e = cachedEntries[index];
    if (!e) return;
    editingIndex = index;
    document.getElementById('editCategory').value = e.category;
    document.getElementById('editDesc').value = e.desc;
    document.getElementById('editAmount').value = e.amount;
    try {
      const [datePart] = e.date.split(' ');
      const [m, d] = datePart.split('/');
      document.getElementById('editDate').value = `${currentYear}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    } catch { document.getElementById('editDate').value = ''; }
    document.getElementById('editModalOverlay').classList.add('open');
  }
  window.openEditModal = openEditModal;

  function closeEditModal(event) { if (event.target === document.getElementById('editModalOverlay')) closeEditModalDirect(); }
  window.closeEditModal = closeEditModal;
  function closeEditModalDirect() { document.getElementById('editModalOverlay').classList.remove('open'); editingIndex = -1; }
  window.closeEditModalDirect = closeEditModalDirect;

  async function saveEdit() {
    if (editingIndex < 0) return;
    const desc = document.getElementById('editDesc').value.trim();
    const amount = parseInt(document.getElementById('editAmount').value);
    const category = document.getElementById('editCategory').value;
    if (!desc || !amount || amount <= 0) { alert('내용과 금액을 입력해주세요!'); return; }
    let newDate = cachedEntries[editingIndex].date;
    const dateVal = document.getElementById('editDate').value;
    if (dateVal) {
      const [, mm, dd] = dateVal.split('-');
      const timePart = newDate.includes(' ') ? newDate.split(' ')[1] : '00:00';
      newDate = `${parseInt(mm)}/${parseInt(dd)} ${timePart}`;
    }
    cachedEntries[editingIndex] = { ...cachedEntries[editingIndex], desc, amount, category, date: newDate };
    await saveData();
    closeEditModalDirect();
    render();
  }
  window.saveEdit = saveEdit;

  async function deleteEntry() {
    if (editingIndex < 0) return;
    if (!confirm('이 내역을 삭제할까요?')) return;
    cachedEntries.splice(editingIndex, 1);
    await saveData();
    closeEditModalDirect();
    render();
  }
  window.deleteEntry = deleteEntry;

  function closeModal(event) { if (event.target === document.getElementById('modalOverlay')) closeModalDirect(); }
  window.closeModal = closeModal;
  function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }
  window.closeModalDirect = closeModalDirect;

  buildMonthTabs();
  setTodayDate();
  loadData();
</script>
</body>
</html>
